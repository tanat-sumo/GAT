name: paper-trade

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run paper trade
        run: python scripts/paper_trade.py
      - name: Commit state
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_trade/state.json
          git diff --cached --quiet || git commit -m "paper trade update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
